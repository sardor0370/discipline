b(){const w=S.b.filter(x=>x.d>=k(ad(T,-6))).length;return head("Backtest","Nimani sinadim, nimani o’rgandim","ab")+`<div style="height:90px"></div><div style="display:flex;gap:10px"><div class="cd" style="flex:1"><div class="lb">Jami yozuv</div><div style="font-size:22px;font-weight:800;color:var(--ac)">${S.b.length}</div></div><div class="cd" style="flex:1"><div class="lb">Bu hafta</div><div style="font-size:22px;font-weight:800">${w}</div></div></div>`+(S.b.length?S.b.map(x=>`<div class="cd nt" data-a="vb" data-i="${x.id}">${x.i?`<img class="th" src="${x.i}" alt="">`:`<svg class="th" viewBox="0 0 76 76"><path d="M6 58L22 44L34 50L48 28L60 34L70 16" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linejoin="round"/></svg>`}<div><h3>${esc(x.t)}</h3><div class="lb" style="font-size:12px">${dfm(x.d)}</div><p><b>O’rgandim:</b> ${esc(x.l)}</p></div></div>`).join(""):empty("Hali yozuv yo’q. + bosib birinchi backtestni qo’shing."))},
m(){const b=S.bk,pc=b.p?Math.min(100,b.r/b.p*100):0;return head("Mutola’a","Kitobdan olgan bilim va iboralar","aq")+`<div class="cd" data-a="bk" style="display:flex;gap:14px;align-items:center;cursor:pointer"><div style="width:48px;height:68px;border-radius:6px;background:linear-gradient(160deg,#F59E0B,#92400E);flex:none"></div><div style="flex:1"><div class="lb" style="font-size:12px">Hozir o’qiyapman</div><div style="font-size:16px;font-weight:800;margin-top:2px">${esc(b.t||"Kitob nomini kiriting")}</div><div style="height:6px;background:#2B2418;border-radius:3px;margin-top:10px"><div style="width:${pc}%;height:6px;background:var(--ac);border-radius:3px"></div></div><div class="lb" style="font-size:12px;margin-top:6px">${b.r} / ${b.p} bet</div></div></div>`+(S.q.length?S.q.map(x=>`<div class="cd q" data-a="vq" data-i="${x.id}"><div class="g">“</div><p>${esc(x.t)}</p><div class="m"><span>${esc(x.s||"Kitob")}${x.pg?", "+esc(x.pg)+"-bet":""}</span><span>${x.g}</span></div></div>`).join(""):empty("Hali yozuv yo’q. + bosib birinchi iborani saqlang."))},
s(){const l=lvl();let bars="",lab="";for(let i=6;i>=0;i--){const d=ad(T,-i);bars+=`<i class="${i==0?"t":""}" style="height:${Math.max(4,pct(k(d))*100)}%"></i>`;lab+=`<span>${W2[d.getDay()]}</span>`}
const rates=S.h.map(h=>{let a=0,d=0;for(let i=0;i<30;i++){const kk=k(ad(T,-i));if(h.s<=kk&&kk<=h.e){a++;if(L(h.id,kk)=="d")d++}}return{n:h.n,r:a?d/a:0,a}}).filter(x=>x.a);rates.sort((a,b)=>b.r-a.r);

vq:d=>{const x=S.q.find(y=>y.id==d.i);CUR=d;open(`<div style="font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:20px;line-height:1.5">“${esc(x.t)}”</div><div class="lb">${esc(x.s)} ${x.pg?esc(x.pg)+"-bet":""} · ${x.g}</div><div class="rw"><button class="btn g" data-a="x">Yopish</button><button class="btn r" data-a="dq">O’chirish</button></div>`)},

const F={m:"f",left:1500,run:false,iv:0},fmt=()=>String(Math.floor(F.left/60)).padStart(2,"0")+":"+String(F.left%60).padStart(2,"0");
