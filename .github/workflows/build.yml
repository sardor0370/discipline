name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Loyiha fayllarini tayyorlash
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json sw.js icon-192.png icon-512.png www/ 2>/dev/null || true
          cat > package.json <<'EOF'
          {
            "name": "intizom",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/cli": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "uz.sardor.intizom",
            "appName": "Intizom",
            "webDir": "www",
            "backgroundColor": "#0B0B0C"
          }
          EOF
      - run: npm install
      - run: npx cap add android
      - name: Ikonka
        continue-on-error: true
        run: |
          cd android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp "$GITHUB_WORKSPACE/icon-192.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-192.png" "$d/ic_launcher_round.png"
          done
      - run: npx cap sync android
      - name: APK yasash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: intizom-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
